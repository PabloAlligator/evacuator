<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#0b0c0e">
    <title>Управление — Эвакуатор 19</title>
    <link rel="icon" href="/site/img/icon.png">
    <link rel="manifest" href="/control/manifest.webmanifest">
    <link rel="stylesheet" href="/control/vendor/tabler/tabler-icons.min.css">
    <link rel="stylesheet" href="/site/css/admin/control.min.css">
    <script src="/control/assets/control.js" defer></script>
  </head>
  <body class="app-page">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand brand--sidebar" href="#/dashboard"><span class="brand__name">ЭВАКУАТОР</span><span class="brand__number">19</span></a>
        <nav class="sidebar__nav" aria-label="Основная навигация">
          <a href="#/dashboard" data-route="dashboard"><i class="ti ti-home"></i><span>Главная</span></a>
          <a href="#/orders" data-route="orders"><i class="ti ti-clipboard-list"></i><span>Заказы</span></a>
          <a href="#/clients" data-route="clients"><i class="ti ti-users"></i><span>Клиенты</span></a>
          <a href="#/tasks" data-route="tasks"><i class="ti ti-checklist"></i><span>Задачи</span></a>
          <a href="#/finances" data-route="finances"><i class="ti ti-wallet"></i><span>Финансы</span></a>
          <a href="#/settings" data-route="settings"><i class="ti ti-settings"></i><span>Настройки</span></a>
        </nav>
        <div class="sidebar__footer">
          <div class="user-chip"><span class="user-chip__avatar" id="user-avatar">В</span><span><b id="user-name">Владелец</b><small>OWNER</small></span></div>
          <button class="icon-button" type="button" data-action="logout" aria-label="Выйти"><i class="ti ti-logout"></i></button>
        </div>
      </aside>

      <section class="workspace">
        <header class="mobile-header">
          <a class="brand" href="#/dashboard"><span class="brand__name">ЭВАКУАТОР</span><span class="brand__number">19</span></a>
          <button class="icon-button" type="button" data-action="logout" aria-label="Выйти"><i class="ti ti-logout"></i></button>
        </header>
        <main id="app" class="main" tabindex="-1"></main>
      </section>

      <nav class="bottom-nav" aria-label="Мобильная навигация">
        <a href="#/dashboard" data-route="dashboard"><i class="ti ti-home"></i><span>Главная</span></a>
        <a href="#/orders" data-route="orders"><i class="ti ti-clipboard-list"></i><span>Заказы</span></a>
        <button type="button" class="bottom-nav__create" data-action="new-order" aria-label="Новый заказ"><i class="ti ti-plus"></i></button>
        <a href="#/clients" data-route="clients"><i class="ti ti-users"></i><span>Клиенты</span></a>
        <a href="#/more" data-route="more"><i class="ti ti-dots"></i><span>Ещё</span></a>
      </nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>
